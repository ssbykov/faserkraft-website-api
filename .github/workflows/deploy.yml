name: Build and deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --only main --no-root

      - name: Check imports
        run: python -c "import app.models; import app.main"

  deploy:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_SSH_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          FRONTEND_REVALIDATE_SECRET: ${{ secrets.FRONTEND_REVALIDATE_SECRET }}
        run: |
          PORT="${VPS_SSH_PORT:-22}"
          SSH="ssh -p $PORT ${VPS_USER}@${VPS_HOST}"

          rsync -az --delete \
            -e "ssh -p $PORT" \
            --exclude '.git' --exclude '.env' --exclude 'media' --exclude 'backups' \
            ./ "${VPS_USER}@${VPS_HOST}:faserkraft-website-api/"

          $SSH 'umask 077; cat > ~/faserkraft-website-api/.env' <<EOF
          PROJECT_NAME=Faserkraft Website API
          ENVIRONMENT=production
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=fk_web
          SECRET_KEY=${SECRET_KEY}
          ADMIN_SESSION_MAX_AGE_SECONDS=28800
          CORS_ORIGINS=${CORS_ORIGINS}
          TRUST_PROXY=true
          FRONTEND_REVALIDATE_URL=http://127.0.0.1:3000/api/revalidate/homepage
          FRONTEND_REVALIDATE_SECRET=${FRONTEND_REVALIDATE_SECRET}
          EOF

          $SSH '
            cd ~/faserkraft-website-api &&
            docker compose -f docker-compose.prod.yml up -d --build &&
            docker compose -f docker-compose.prod.yml run --rm -T api alembic upgrade head &&
            docker image prune -f
          '