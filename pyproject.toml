[project]
name = "faserkraft-website-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Sergei Bykov",email = "ss.bykoff@gmail.com"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.34.0,<0.35.0)",
    "sqlalchemy (>=2.0.54,<2.1.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "psycopg2-binary (>=2.9.10,<2.10.0)",
    "alembic (>=1.14.0,<1.15.0)",
    "pydantic (>=2.10.0,<3.0.0)",
    "pydantic-settings (>=2.7.0,<3.0.0)",
    "pyjwt (>=2.10.0,<3.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "httpx (>=0.28.0,<0.29.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "sqladmin (>=0.20.1,<0.21.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "passlib[argon2] (==1.7.4)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "bleach (>=6.4.0,<7.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"