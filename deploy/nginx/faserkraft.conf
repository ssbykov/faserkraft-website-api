server {
    listen 80;
    server_name test.faserkraft.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name test.faserkraft.ru;

    ssl_certificate     /etc/letsencrypt/live/test.faserkraft.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.faserkraft.ru/privkey.pem;

    client_max_body_size 50m;

    location ~ ^/(api|admin|media|health)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}